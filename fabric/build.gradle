plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations {
    shaderMods
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    shaderMods "maven.modrinth:sodium:SMxNOGZ6"
    shaderMods "maven.modrinth:iris:bAo1Qhte"
    shaderMods "maven.modrinth:euphoria-patches:i5Yuafoq"
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
            runDir 'run-server'
        }
    }
}

// iris only works against the real intermediary game, its mixins break once loom remaps them
tasks.register('shaderClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(configurations.shaderMods)
    mods.from(configurations.detachedConfiguration(
            dependencies.create("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")))
    runDir = file('run')
}
